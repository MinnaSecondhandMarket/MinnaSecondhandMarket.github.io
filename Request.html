<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request an Item — Secondhand Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E7;
    --rust:#C1542C;
    --sage:#6E7F5C;
    --ink:#2E2A24;
    --tag:#F2C572;
    --line:#D8C9AE;
    --card:#FFFDF8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.5;}
  h1,h2{font-family:'Fraunces',serif;font-weight:700;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px;}

  /* HEADER */
  header{padding:18px 0;border-bottom:1px solid var(--line);}
  header .wrap{display:flex;align-items:center;justify-content:space-between;max-width:1120px;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;}
  .logo .dot{width:12px;height:12px;border-radius:50%;background:var(--rust);}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:0.9rem;font-weight:600;opacity:0.7;transition:opacity .2s;}
  .back-btn:hover{opacity:1;}
  .back-btn::before{content:"←";}

  /* HERO */
  .page-hero{padding:50px 0 10px;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--sage);margin-bottom:14px;}
  .eyebrow::before{content:"";width:24px;height:1px;background:var(--sage);}
  .page-hero h1{font-size:2.4rem;line-height:1.1;margin-bottom:12px;}
  .page-hero h1 em{font-style:italic;color:var(--rust);}
  .page-hero p{opacity:0.7;font-size:1rem;max-width:480px;margin-bottom:0;}

  /* FORM */
  .form-section{padding:40px 0 60px;}
  .form-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:36px;
  }
  .field{margin-bottom:22px;}
  .field label{
    display:block;
    font-size:0.88rem;font-weight:600;
    margin-bottom:8px;
    opacity:0.8;
  }
  .field input,
  .field textarea,
  .field select{
    width:100%;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:#fff;
    font-family:'Work Sans',sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    transition:border-color .2s;
    outline:none;
  }
  .field input:focus,
  .field textarea:focus,
  .field select:focus{border-color:var(--rust);}
  .field textarea{resize:vertical;min-height:110px;}
  .field .hint{font-size:0.78rem;opacity:0.55;margin-top:6px;}

  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  .submit-btn{
    width:100%;padding:16px;
    background:var(--ink);color:var(--paper);
    border:none;border-radius:14px;
    font-family:'Work Sans',sans-serif;
    font-size:1rem;font-weight:700;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
    margin-top:6px;
  }
  .submit-btn:hover{transform:translateY(-2px);opacity:0.88;}

  /* SUCCESS */
  .success-msg{
    display:none;
    background:#f0faf4;
    border:1.5px solid #6E7F5C;
    border-radius:14px;
    padding:20px 24px;
    margin-top:20px;
    font-size:0.95rem;
    color:#2E2A24;
  }
  .success-msg strong{color:var(--sage);}

  @media(max-width:600px){
    .row-2{grid-template-columns:1fr;}
    .form-card{padding:24px 18px;}
    .page-hero h1{font-size:1.8rem;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap" style="max-width:1120px;">
    <div class="logo"><span class="dot"></span>Secondhand Market</div>
    <a class="back-btn" href="index.html">Back to listings</a>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow">Can't find it?</span>
    <h1>Request an <em>item</em> you need.</h1>
    <p>Tell us what you're looking for and we'll try to source it for you at a fair secondhand price.</p>
  </div>
</section>

<section class="form-section">
  <div class="wrap">
    <div class="form-card">

      <!-- Netlify Forms magic: add netlify attribute -->
      <form name="item-requests" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="item-requests">
        <!-- Honeypot field to block spam -->
        <p style="display:none;"><input name="bot-field"></p>

        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Alameen" required>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 08012345678" required>
          </div>
          <div class="field">
            <label for="whatsapp">WhatsApp number</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="Same as phone? Leave blank">
          </div>
        </div>

        <div class="field">
          <label for="item">What are you looking for?</label>
          <input type="text" id="item" name="item" placeholder="e.g. iPhone 12, Samsung TV, Dining table..." required>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">Select a category</option>
            <option>Electronics</option>
            <option>Furniture</option>
            <option>Fashion & Clothing</option>
            <option>Kitchen & Appliances</option>
            <option>Sports & Fitness</option>
            <option>Books & Education</option>
            <option>Other</option>
          </select>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="budget-min">Minimum budget (₦)</label>
            <input type="number" id="budget-min" name="budget-min" placeholder="e.g. 50000">
          </div>
          <div class="field">
            <label for="budget-max">Maximum budget (₦)</label>
            <input type="number" id="budget-max" name="budget-max" placeholder="e.g. 100000">
          </div>
        </div>

        <div class="field">
          <label for="details">Extra details (optional)</label>
          <textarea id="details" name="details" placeholder="Any specific colour, size, brand, condition preference..."></textarea>
          <span class="hint">The more detail you give, the better we can match your request.</span>
        </div>

        <button type="submit" class="submit-btn">Submit request</button>
      </form>

    </div>
  </div>
</section>

</body>
</html>

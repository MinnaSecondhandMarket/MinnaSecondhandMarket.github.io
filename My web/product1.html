<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microwave Oven — Secondhand Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E7;
    --rust:#C1542C;
    --sage:#6E7F5C;
    --ink:#2E2A24;
    --tag:#F2C572;
    --line:#D8C9AE;
    --card:#FFFDF8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px;}
  header{padding:18px 0;border-bottom:1px solid var(--line);}
  header .wrap{display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;}
  .logo .dot{width:12px;height:12px;border-radius:50%;background:var(--rust);}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:0.9rem;font-weight:600;opacity:0.7;transition:opacity .2s;}
  .back-btn:hover{opacity:1;}
  .back-btn::before{content:"←";}
  .product{padding:48px 0 60px;}
  .product .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;}
  .media-col{display:flex;flex-direction:column;gap:16px;}
  .main-photo{border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;background:var(--card);display:flex;align-items:center;justify-content:center;max-height:320px;}
  .main-photo img{width:100%;height:100%;object-fit:cover;}
  .second-photo-wrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;background:var(--card);max-height:320px;}
  .second-photo-wrap img{width:100%;height:100%;object-fit:cover;}
  .condition-badge{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;padding:6px 14px;border-radius:20px;}
  .condition-badge.overlay{position:absolute;top:12px;left:12px;z-index:1;margin-bottom:0;}
  .details-col .condition-badge{margin-bottom:16px;}
  .product-name{font-size:2rem;line-height:1.1;margin-bottom:10px;}
  .product-meta{font-size:0.95rem;opacity:0.65;margin-bottom:20px;}
  .divider{border:none;border-top:1px solid var(--line);margin:20px 0;}
  .price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:24px;}
  .price-label{font-size:0.82rem;opacity:0.6;font-weight:500;}
  .price{font-family:'Fraunces',serif;font-weight:700;font-size:2.2rem;color:var(--rust);}
  .specs{margin-bottom:24px;}
  .specs h3{font-size:1rem;margin-bottom:12px;opacity:0.7;font-weight:600;font-family:'Work Sans',sans-serif;}
  .spec-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:0.9rem;}
  .spec-row .key{opacity:0.6;}
  .spec-row .val{font-weight:600;}
  .cta-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:#25D366;color:#fff;border-radius:14px;font-weight:700;font-size:1rem;transition:transform .15s ease,opacity .15s ease;margin-bottom:12px;}
  .cta-btn:hover{transform:translateY(-2px);opacity:0.92;}
  .cta-note{font-size:0.78rem;opacity:0.55;text-align:center;}
  @media(max-width:680px){
    .product .wrap{grid-template-columns:1fr;gap:28px;}
    .product{padding:28px 0 40px;}
    .product-name{font-size:1.6rem;}
    .price{font-size:1.8rem;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo"><span class="dot"></span>Secondhand Market</div>
    <a class="back-btn" href="index.html">Back to listings</a>
  </div>
</header>

<section class="product">
  <div class="wrap">

    <!-- LEFT COLUMN: images -->
    <div class="media-col">
      <div class="main-photo">
        <img src="Photos/microwaveoven.jpeg" alt="Microwave Oven">
      </div>
      <div class="second-photo-wrap">
        <img src="Photos/" alt="Microwave Oven">
        <span class="condition-badge overlay">Used</span>
      </div>
    </div>

    <!-- RIGHT COLUMN: details -->
    <div class="details-col">

      <h1 class="product-name"></h1>
      <p class="product-meta"></p>

      <hr class="divider">

      <div class="price-row">
        <span class="price-label">Price</span>
        <span class="price"></span>
      </div>

      <div class="specs">
        <h3>Details</h3>
        <div class="spec-row"><span class="key">Condition</span><span class="val"></span></div>
        <div class="spec-row"><span class="key">Color</span><span class="val"></span></div>
        <div class="spec-row"><span class="key">Location</span><span class="val"></span></div>
      </div>

      <a class="cta-btn" href="https://wa.me/2349065054698?text=Hi%2C%20I'm%20interested%20in%20your%20listing%20on%20Secondhand%20Market.">
        💬 Chat on WhatsApp
      </a>
      <p class="cta-note">Tap to open WhatsApp — no sign up needed</p>

    </div>

  </div>
</section>

</body>
</html>

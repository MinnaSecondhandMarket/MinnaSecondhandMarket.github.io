    <rect x="10" y="35" width="110" height="18" rx="6" fill="#C1542C"/>
    <path d="M35 35 Q35 8 55 8 Q65 8 65 20" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round"/>
    <path d="M95 35 Q95 8 75 8 Q65 8 65 20" fill="none" stroke="#2E2A24" stroke-width="7" stroke-linecap="round"/>
    <text x="65" y="92" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#C1542C" text-anchor="middle">₦</text>
